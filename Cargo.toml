[package]
name = "nsh-app-video-squeezer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
log = "0.4"
rfd = "0.15"
url = "2"

# The app's tests drive it headless through NSH's own harness, the same
# engine a device runs (`nsh test` runs these too, alongside the TSX ones).
[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
